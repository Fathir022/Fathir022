<svg xmlns="http://w3.org" viewBox="0 0 450 150" width="450" height="150" style="background: #121212; border-radius: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Clip path untuk membuat sudut foto album melengkung (rounded) -->
    <clipPath id="album-clip">
      <rect x="20" y="20" width="110" height="110" rx="12" />
    </clipPath>
  </defs>

  <!-- BACKGROUND ALBUM ART (Ganti URL di bawah dengan link foto album favoritmu) -->
  <image href="https://unsplash.com" x="20" y="20" width="110" height="110" clip-path="url(#album-clip)" preserveAspectRatio="xMidYMid slice" />

  <!-- JUDUL LAGU & NAMA ARTIS (Ganti teks di bawah ini) -->
  <text x="150" y="48" fill="#FFFFFF" font-size="18" font-weight="bold" letter-spacing="-0.5px">Judul Lagu Favoritmu</text>
  <text x="150" y="70" fill="#B3B3B3" font-size="14" font-weight="medium">Nama Penyanyi / Band</text>

  <!-- PROGRESS BAR (Gimmick Durasi) -->
  <text x="150" y="98" fill="#A7A7A7" font-size="11">1:45</text>
  <rect x="185" y="91" width="200" height="4" rx="2" fill="#3E3E3E" />
  <!-- Width 120 berarti lagu sudah berjalan sekitar 60% -->
  <rect x="185" y="91" width="120" height="4" rx="2" fill="#1DB954" /> 
  <!-- Bulatan progress penunjuk durasi -->
  <circle cx="305" cy="93" r="5" fill="#FFFFFF" />
  <text x="395" y="98" fill="#A7A7A7" font-size="11">3:30</text>

  <!-- TOMBOL CONTROLS (Gimmick) -->
  <!-- Previous -->
  <path d="M160 125 l-10 -7 v14 z M150 118 v14" fill="#B3B3B3" stroke="#B3B3B3" stroke-width="2" stroke-linejoin="round"/>
  <!-- Pause Button (Menandakan lagu sedang dimainkan) -->
  <circle cx="200" cy="125" r="14" fill="#FFFFFF" />
  <rect x="194" y="117" width="4" height="16" fill="#000000" rx="1" />
  <rect x="202" y="117" width="4" height="16" fill="#000000" rx="1" />
  <!-- Next -->
  <path d="M230 125 l10 -7 v14 z M240 118 v14" fill="#B3B3B3" stroke="#B3B3B3" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- BADGE KECIL (Opsional: Menandakan ini lagu favorit) -->
  <rect x="360" y="32" width="70" height="20" rx="10" fill="#1DB954" opacity="0.2"/>
  <text x="395" y="46" fill="#1DB954" font-size="10" font-weight="bold" text-anchor="middle">FAVORITE</text>
</svg>
