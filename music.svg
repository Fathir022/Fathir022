<svg width="400" height="120" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Membuat efek sudut melengkung pada gambar album -->
    <clipPath id="cover-clip">
      <rect x="15" y="15" width="90" height="90" rx="10"/>
    </clipPath>
  </defs>
  
  <!-- Background Card -->
  <rect width="400" height="120" rx="15" fill="#18181b"/>

  <!-- Gambar Album (Acheron) -->
  <!-- HAPUS tulisan PASTE_KODE_BASE64_DI_SINI dan paste kode dari web di dalam tanda kutip -->
<image x="15" y="15" width="90" height="90" xlink:href="data:image/png;base64," />
  
  <!-- Teks Judul Lagu & Artis -->
  <text x="120" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
    Good Night (feat.Claire Young)
  </text>
  <text x="120" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#a1a1aa">
    Dept
  </text>

  <!-- Progress Bar -->
  <rect x="120" y="95" width="240" height="6" rx="3" fill="#3f3f46"/>
  <rect x="120" y="95" width="120" height="6" rx="3" fill="#1db954">
    <animate attributeName="width" from="0" to="240" dur="90s" repeatCount="indefinite" fill="freeze" />
  </rect>

</svg>
  
